name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p android/keystore
          cd android/keystore
          if gh release download signing-key -p meetings.jks -p password.txt --clobber 2>/dev/null; then
            echo "Using the stable signing key stored in the 'signing-key' release."
          else
            echo "No signing key yet. Generating one and storing it in a private release (keep it; it lets updates install over the old version)."
            PW=$(openssl rand -hex 16)
            echo -n "$PW" > password.txt
            keytool -genkeypair -keystore meetings.jks -storepass "$PW" -keypass "$PW" \
              -alias meetings -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Yarin Meetings, O=Yarin Ashwal Law, C=IL"
            gh release create signing-key meetings.jks password.txt --prerelease \
              --title "מפתח חתימה (לא למחוק)" --notes "נוצר אוטומטית. חובה לשמור כדי שעדכוני האפליקציה יתקינו מעל הגרסה הקודמת."
          fi
          echo "KEYSTORE_PASSWORD=$(cat password.txt)" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(cat password.txt)" >> $GITHUB_ENV

      - name: Build APK
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/android/keystore/meetings.jks
          KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
          KEY_ALIAS: meetings
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release.apk "meetings-v${VERSION}.apk"
          echo "APK=meetings-v${VERSION}.apk" >> $GITHUB_ENV
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - uses: actions/upload-artifact@v4
        with:
          name: meetings-apk
          path: ${{ env.APK }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${APK}" \
            --title "פגישות v${VERSION} (build ${GITHUB_RUN_NUMBER})" \
            --notes "קובץ ההתקנה העדכני ביותר. הורד את ה-APK בטלפון והתקן." \
            --latest
